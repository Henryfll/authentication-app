name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, test and verify coverage
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # Construye la imagen de contenedor y ejecuta la prueba de humo del despliegue
  # (scripts/smoke-test.sh) para detectar problemas que los tests no cubren:
  # el perfil `prod`, el usuario sin privilegios o el sistema de ficheros de solo lectura.
  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t authentication-app:ci .

      - name: Smoke test
        run: IMAGE=authentication-app:ci scripts/smoke-test.sh
