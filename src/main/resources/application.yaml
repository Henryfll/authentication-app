spring:
  application:
    name: authentication-app
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:auth}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  docker:
    compose:
      enabled: false

app:
  # Versión de la compilación (la sustituye Maven). La usan el contrato OpenAPI y /actuator/info.
  version: "@project.version@"
  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8080}
      key-id: ${JWT_KEY_ID:auth-key-1}
      private-key: ${JWT_PRIVATE_KEY:}
      allow-ephemeral-key: false
    cors:
      origins-cache-ttl: 30s
    refresh-cookie:
      name: refresh_token
      secure: true
    rate-limit:
      login-by-ip:
        capacity: 30
        period: 1m
      login-by-email:
        capacity: 10
        period: 1m
      refresh-by-ip:
        capacity: 120
        period: 1m
    lockout:
      max-failed-attempts: 5
      base-lock-duration: 15m
      max-lock-duration: 24h
  bootstrap:
    admin:
      email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${app.version:dev}

springdoc:
  # Los endpoints devuelven JSON; sin esto el contrato declara `*/*` en las respuestas.
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
app:
  security:
    jwt:
      allow-ephemeral-key: true
    refresh-cookie:
      # En local se usa HTTP sin TLS: el navegador no enviaría una cookie Secure.
      secure: false
logging:
  level:
    com.henryfll.auth: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  # En producción no hay valores por defecto para lo que identifica al despliegue: si falta
  # alguna de estas variables la aplicación no arranca, en lugar de usar los valores de desarrollo
  # (base de datos local con auth/auth o un issuer http://localhost).
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
app:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
server:
  # Detrás de un proxy inverso, usa X-Forwarded-For y X-Forwarded-Proto solo si la petición llega
  # desde un proxy de confianza (por defecto, rangos de red privados). Ver docs/DEPLOYMENT.md.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
