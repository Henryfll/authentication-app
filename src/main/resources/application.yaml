spring:
  application:
    name: authentication-app
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DB_USERNAME:auth}
    password: ${DB_PASSWORD:auth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  docker:
    compose:
      enabled: false

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8080}
      key-id: ${JWT_KEY_ID:auth-key-1}
      private-key: ${JWT_PRIVATE_KEY:}
      allow-ephemeral-key: false
    cors:
      origins-cache-ttl: 30s
    refresh-cookie:
      name: refresh_token
      secure: true
  bootstrap:
    admin:
      email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${app.version:dev}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
app:
  security:
    jwt:
      allow-ephemeral-key: true
    refresh-cookie:
      # En local se usa HTTP sin TLS: el navegador no enviaría una cookie Secure.
      secure: false
logging:
  level:
    com.henryfll.auth: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
