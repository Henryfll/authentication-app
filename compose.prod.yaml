# Despliegue de referencia: la aplicación y su base de datos PostgreSQL.
#
#   cp .env.example .env     # y completar los valores
#   docker build -t authentication-app:latest .
#   docker compose -f compose.prod.yaml up -d
#
# No usar para desarrollo: para eso está compose.yaml, que arranca Spring Boot automáticamente.
# Documentación: docs/DEPLOYMENT.md

services:
  app:
    image: ${IMAGE:-authentication-app:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/auth
      DB_USERNAME: auth
      DB_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_ISSUER: ${JWT_ISSUER:?define JWT_ISSUER en .env}
      JWT_KEY_ID: ${JWT_KEY_ID:-auth-key-1}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?define JWT_PRIVATE_KEY en .env}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    # Sin `ports`: la base de datos solo es accesible desde la aplicación.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
